name: Quant Engine CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 3. Pull down your repository code onto the server
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 4. Install Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # Speeds up future runs by caching dependencies

    # 5. Install the packages from your requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 6. Run the tests! (The Recruiter Hook)
    - name: Run Pytest Suite
      env:
        # We inject the API key securely from GitHub Secrets
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }} 
      run: |
        # This will automatically find and run test_rag.py and test_portfolio.py
        pytest -v tests/